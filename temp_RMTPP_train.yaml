RMTPP_train:
  base_config:
    backend: torch
    base_dir: ./checkpoints/
    dataset_id: e_commerce
    model_id: RMTPP
    runner_id: std_tpp
    stage: train
  model_config:
    dropout: 0.0
    hidden_size: 32
    loss_integral_num_sample_per_step: 20
    mc_num_sample_per_step: 20
    num_heads: 2
    num_layers: 2
    sharing_param_layer: false
    thinning:
      dtime_max: 5
      look_ahead_time: 10
      num_exp: 500
      num_sample: 1
      num_samples_boundary: 5
      num_seq: 10
      over_sample_rate: 5
      patience_counter: 5
    time_emb_size: 16
    use_ln: false
  trainer_config:
    batch_size: 256
    gpu: 0
    learning_rate: 0.001
    max_epoch: 500
    metrics:
    - acc
    - rmse
    - mae
    - type_error_rate
    optimizer: adam
    seed: 2019
    shuffle: false
    use_tfb: false
    valid_freq: 1
data:
  amazon:
    data_format: json
    data_specs:
      num_event_types: 16
      pad_token_id: 16
      padding_side: right
      truncation_side: right
    test_dir: easytpp/amazon
    train_dir: easytpp/amazon
    valid_dir: easytpp/amazon
  e_commerce:
    data_format: json
    data_specs:
      num_event_types: 5
      pad_token_id: 5
      padding_side: right
      truncation_side: right
    test_dir: dataset/e_commerce_test.json
    train_dir: dataset/e_commerce_train.json
    valid_dir: dataset/e_commerce_train.json
  retweet:
    data_format: json
    data_specs:
      num_event_types: 3
      pad_token_id: 3
      padding_side: right
      truncation_side: right
    test_dir: easytpp/retweet
    train_dir: easytpp/retweet
    valid_dir: easytpp/retweet
  stackoverflow:
    data_format: json
    data_specs:
      num_event_types: 22
      pad_token_id: 22
      padding_side: right
      truncation_side: right
    test_dir: easytpp/stackoverflow
    train_dir: easytpp/stackoverflow
    valid_dir: easytpp/stackoverflow
  taobao:
    data_format: json
    data_specs:
      num_event_types: 20
      pad_token_id: 20
      padding_side: right
      truncation_side: right
    test_dir: easytpp/taobao
    train_dir: easytpp/taobao
    valid_dir: easytpp/taobao
  taxi:
    data_format: json
    data_specs:
      num_event_types: 10
      pad_token_id: 10
      padding_side: right
      truncation_side: right
    test_dir: easytpp/taxi
    train_dir: easytpp/taxi
    valid_dir: easytpp/taxi
pipeline_config_id: runner_config
